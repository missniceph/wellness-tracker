<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17777c"/>
      <stop offset="1" stop-color="#0b3d41"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- progress ring -->
  <g transform="translate(250 315)">
    <circle r="165" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="34"/>
    <circle r="165" fill="none" stroke="#f07a66" stroke-width="34" stroke-linecap="round" stroke-dasharray="725 1037" transform="rotate(-90)"/>
    <text y="18" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="128" font-weight="800" fill="#ffffff" letter-spacing="-4">100</text>
    <text y="80" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffd9d1" letter-spacing="9">DAYS</text>
  </g>
  <g font-family="Helvetica Neue, Arial, sans-serif" fill="#ffffff">
    <text x="500" y="230" font-size="64" font-weight="800" letter-spacing="-1">100-Day Progress</text>
    <text x="500" y="306" font-size="64" font-weight="800" letter-spacing="-1">Tracker</text>
    <text x="500" y="372" font-size="30" fill="#d8ebe9">Weight, workouts, steps and habits.</text>
    <text x="500" y="414" font-size="30" fill="#d8ebe9">Private, on your phone.</text>
  </g>
  <!-- mini weekly-score bars -->
  <g transform="translate(500 450)">
    <rect x="0"   y="40" width="44" height="80"  rx="8" fill="#ffffff" fill-opacity=".22"/>
    <rect x="60"  y="22" width="44" height="98"  rx="8" fill="#ffffff" fill-opacity=".32"/>
    <rect x="120" y="52" width="44" height="68"  rx="8" fill="#ffffff" fill-opacity=".22"/>
    <rect x="180" y="12" width="44" height="108" rx="8" fill="#ffffff" fill-opacity=".42"/>
    <rect x="240" y="0"  width="44" height="120" rx="8" fill="#f07a66"/>
  </g>
</svg>
