<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>100-Day Progress Tracker</title>
  <meta name="description" content="Track your weight, workouts, steps and habits for 100 days. Private: no login, and everything stays on your phone.">
  <!-- Link previews (Facebook, Messenger, Viber, X, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="100-Day Progress Tracker">
  <meta property="og:description" content="Track your weight, workouts, steps and habits for 100 days. Private: no login, and everything stays on your phone.">
  <meta property="og:url" content="https://missniceph.github.io/wellness-tracker/">
  <meta property="og:image" content="https://missniceph.github.io/wellness-tracker/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="100-Day Progress Tracker: a teal card with a coral progress ring around the number 100">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0f5257" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1719" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="100 Days">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Apply the saved theme before the page paints (avoids a flash).
    try {
      var t = localStorage.getItem('ptracker.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div id="storageWarning" class="banner" hidden>
    Your browser is blocking storage, so entries won't be kept. Turn off private browsing, or export a backup before closing.
  </div>
  <main id="view" tabindex="-1"></main>
  <footer class="site-foot">
    <a href="https://instagram.com/missniceph" target="_blank" rel="noopener" aria-label="@missniceph on Instagram (opens in a new tab)">@missniceph</a>
  </footer>
  <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg>
      <span>Today</span>
    </a>
    <a href="#dashboard" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="#weekly" data-tab="weekly">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>
      <span>Weekly</span>
    </a>
    <a href="#measurements" data-tab="measurements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="19" height="8" rx="2"/><path d="M6.5 8v3.5M10 8v2M13.5 8v3.5M17 8v2"/></svg>
      <span>Measurements</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
